[project]
name = "jobbot"
version = "0.1.0"
description = "Discord alerting for internship/apprenticeship openings in France, pulled directly from employer ATSs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

# M9e: jobbot/sources/rendered.py's headless-browser adapter is the ONLY
# thing in this codebase that needs Playwright, and only when a company
# entry actually uses `ats: rendered` -- every other adapter, and the bot
# as a whole, must keep working with this extra never installed (rendered.py
# imports playwright lazily, inside fetch_raw(), never at module level, for
# exactly this reason). Install with `uv sync --extra playwright`, then
# `uv run playwright install --with-deps chromium` for the browser binary
# itself (a separate download `uv sync` doesn't trigger).
[project.optional-dependencies]
playwright = [
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# M13 Part B: "slow" was documented as "opted into rather than run by
# default" since M9e but never actually enforced -- it worked only because
# the one slow test used to skip itself (the loopback network guard it
# needed didn't exist yet). Now that conftest.py's guard permits
# 127.0.0.1/::1 and that test genuinely passes instead of skipping, nothing
# was left excluding it from a bare `pytest` run, and the suite blew past
# CLAUDE.md's 15-second budget (real Chromium launch, ~10s alone). This
# addopts is what the marker's own description always claimed was true:
# `pytest -m slow` (or `-m ""` to clear this default) still runs it for
# real, on demand.
addopts = "-m 'not slow'"
markers = [
    "slow: a real-integration test, opted into rather than run by default (M9e: the one real-Playwright test)",
]

[tool.coverage.run]
# sysmon (Python 3.12+'s sys.monitoring API) cuts coverage-enabled runtime
# roughly in half versus the classic tracer on this suite. Falls back to the
# default tracer with a warning (not an error) on Python <3.12, so this is
# safe under this project's requires-python = ">=3.11".
core = "sysmon"
