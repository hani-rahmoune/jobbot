[project]
name = "jobbot"
version = "0.1.0"
description = "Discord alerting for internship/apprenticeship openings in France, pulled directly from employer ATSs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# sysmon (Python 3.12+'s sys.monitoring API) cuts coverage-enabled runtime
# roughly in half versus the classic tracer on this suite. Falls back to the
# default tracer with a warning (not an error) on Python <3.12, so this is
# safe under this project's requires-python = ">=3.11".
core = "sysmon"
