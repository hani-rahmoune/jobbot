# Greenhouse board tokens: how to find one
# ------------------------------------------
# A Greenhouse-hosted careers page URL looks like one of:
#   https://boards.greenhouse.io/<token>
#   https://job-boards.greenhouse.io/<token>
# `<token>` is what goes in `identifier` below, and is what the adapter
# plugs into https://boards-api.greenhouse.io/v1/boards/<token>/jobs.
#
# If a company embeds Greenhouse on their own domain instead (e.g.
# careers.example.com/jobs), open browser devtools -> Network while the job
# list loads and look for a request to:
#   https://boards-api.greenhouse.io/v1/boards/<token>/jobs?content=true
# `<token>` there is the identifier. View-source works too: search the page
# for "greenhouse.io" and the token is the path segment right after it.
#
# `tier: hot` = companies to poll most frequently (see settings.yaml). Unused
# by anything until M9, but validated now so this file doesn't need
# rewriting later.

# M6: these five produced zero matches on a live run -- none is a French
# company, so nothing here will ever match a Paris/Nantes-focused user. Kept
# (not deleted) as known-good adapter smoke-test entries, demoted to warm so
# they're polled far less often than the French tier: hot entries below.
