# M8 found Workday genuinely public and unauthenticated; every other
# enterprise ATS vendor checked that milestone (iCIMS, SAP SuccessFactors,
# Oracle Taleo, Cegid Talentsoft, Phenom People, Oleeo) was rejected on the
# strength of vendor documentation and a couple of quick probes.
#
# M9 re-investigated all of those properly -- checking what each real
# careers page's OWN request actually does, not just what the vendor
# documents -- and found three of them genuinely public and unauthenticated
# after all: SmartRecruiters, iCIMS's "Jibe" career-site product
# specifically (NOT "classic" iCIMS, which is still rejected -- see
# jobbot/sources/jibe.py's module docstring), and Cegid Talentsoft (via its
# server-rendered candidate-facing listing page, not its authenticated
# REST API). SAP SuccessFactors, Phenom People, Oleeo, Avature, and Oracle
# Taleo were all re-checked for M9 too and confirmed still not viable --
# see the M9 report for the specific reason each one failed.
#
# Every entry below was verified live before being added: fetched its real
# endpoint/page and confirmed real, current postings came back (not just an
# HTTP 200). tier: warm, not hot -- Workday boards in particular can run to
# 2000+ postings per employer and are correspondingly expensive to poll
# often; each adapter's own max_postings/page caps apply regardless of tier.
#
# M9b re-swept the two working vendors (Workday, SmartRecruiters) against a
# much longer list of large French employers, and re-investigated all four
# vendors M9 had rejected, trying harder per CLAUDE.md's Part D playbook
# before concluding again. One more rejected vendor turned out to have a
# genuinely usable path after all: Phenom People's own search widget
# (Orange, Thales) is still confirmed session/CSRF-bound and unusable, but
# both employers' individual job pages -- discoverable through a real,
# robots.txt-listed sitemap -- carry complete, valid schema.org JobPosting
# JSON-LD. That's a different shape of problem than jsonld.py solves (many
# discovered single-posting pages, not one page with many postings
# embedded), so it's a new adapter, not a reuse of jsonld.py --
# see jobbot/sources/sitemap_jsonld.py's module docstring. SAP
# SuccessFactors, iCIMS classic, and Oleeo were all re-confirmed rejected,
# each for a more precise reason than before -- see the M9b report.
#
# Identifier formats (see each adapter module's own docstring for the full
# reasoning):
#   workday          "{tenant}.wd{N}.{site}"
#   smartrecruiters  the bare SmartRecruiters company identifier
#   jibe             the employer's Jibe domain, optionally "|{country}"
#                    for a board that spans more than one country
#   talentsoft       the employer's own Talentsoft subdomain (https URL)
#   sitemap_jsonld   the employer's sitemap index URL (from robots.txt's
#                    own "Sitemap:" line)

