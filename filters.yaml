# Location and keyword preferences. Edit this file to relocate or change
# what you're searching for -- jobbot/ itself contains no hardcoded city,
# region, department code, or keyword (see CLAUDE.md rule 4 and
# test_no_hardcoded_search_terms).

locations:
  # Stage/internship (a few months, often barely paid, so proximity
  # matters) uses this base scope, completely unscoped. Still narrow --
  # Paris, Ile-de-France (now all 8 departments, not just the 4 nearest),
  # Nantes and nearby -- but M20 Part A completed Ile-de-France: 77/78/91/95
  # were missing entirely, and Saclay/Evry in particular are dense with
  # data and chemistry internships despite being a real RER ride from
  # central Paris. Department names are included alongside the codes since
  # a posting often names the department instead of (or as well as) giving
  # a code.
  include:
    - paris
    - ile-de-france
    - "75"
    - "92"
    - "93"
    - "94"
    - "77"
    - "78"
    - "91"
    - "95"
    - seine-et-marne
    - yvelines
    - essonne
    - val-d-oise
    - val d oise
    - hauts-de-seine
    - seine-saint-denis
    - val-de-marne
    - saclay
    - palaiseau
    - orsay
    - gif-sur-yvette
    - massy
    - versailles
    - cergy
    - evry
    - marne-la-vallee
    - nantes
    - "44"
    - loire-atlantique
    - remote
    - teletravail
    - hybride
  exclude: [lyon, marseille, bordeaux, toulouse]
  match_mode: substring        # substring | word
  unknown_location: keep       # keep | drop, applies when location is ""
  # M19 Part A/B: apprenticeship (a year-plus contract with a salary) is
  # worth relocating for, so its own scope widens to every major French
  # city and region below via this override -- internship above is
  # completely unaffected, since it has no entry here and falls through to
  # the base fields unscoped. Accent variants are NOT written out
  # separately (normalize() strips them from both sides of every
  # comparison automatically); hyphen-vs-space slug variants ARE, since
  # normalize() does not touch hyphens and French postings write compound
  # city/region names both ways.
  by_contract_type:
    apprenticeship:
      include:
        # M20 Part A: kept byte-for-byte identical to the base block above
        # (paris ... hybride) so apprenticeship is provably a superset of
        # internship's scope, never missing something internship covers.
        - paris
