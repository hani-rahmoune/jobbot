keywords:
  include: [analyste de donnees, analyste data, chargee d etudes statistiques,
            ingenieur donnees, science des donnees, apprentissage automatique,
            intelligence artificielle, business intelligence,data, donnees, analyste, statistiques, statistique,
            machine learning, deep learning, ia, ai, llm, nlp, analytics,
            python, sql, data science, data engineer, mlops,
            computer vision, decisionnel, bi, big data,
            # Computational chemistry (M19 Part C). French and English
            # mixed freely, both spelling variants of US/UK terms kept,
            # French field-name spelling is genuinely inconsistent across
            # postings (chemoinformatique/cheminformatique/chimioinformatique
            # all seen in the wild) so all three are kept rather than
            # guessing at one "correct" spelling.
            chimie computationnelle, chimie theorique, chimie quantique,
            modelisation moleculaire, dynamique moleculaire, docking moleculaire,
            chemoinformatique, cheminformatique, chimioinformatique,
            computational chemistry, quantum chemistry, theoretical chemistry,
            molecular modeling, molecular modelling, molecular dynamics,
            molecular docking, cheminformatics, chemoinformatics,
            dft, density functional theory, ab initio, qsar, qspr,
            drug design, computer-aided drug design, computer aided drug design, cadd,
            virtual screening, free energy perturbation,
            materials informatics, computational materials, in silico,
            rdkit, schrodinger, vasp, gromacs, autodock, open babel, pyscf,
            quantum espresso, lammps, cp2k,
            molecular representation learning, graph neural network chemistry]
  # Deliberately left OUT of the list above (see M19 Part C report): gaussian,
  # orca, force field, monte carlo simulation. All four are common terms of
  # art far outside computational chemistry too -- Gaussian distributions/
  # processes/blur pervade the ML and statistics postings this same list
  # already targets, ORCA is the animal and assorted unrelated products,
  # "force field" is ordinary physics vocabulary, and Monte Carlo simulation
  # is standard technique across finance, actuarial work, and general
  # engineering reliability analysis. The keyword engine has no per-term
  # co-occurrence/AND condition to require chemistry context alongside them,
  # so rather than build that (out of scope this milestone) or flood the
  # feed, they're left out.
  exclude: [sales, commercial, vente, recrutement, recruiting, recruiter,
            talent, account executive, customer success, marketing]
  match_mode: word             # word | substring
  fields: [title]
  require: any                 # any | all, across the include list
